# configs/eval.yaml — benchmark runs for the proposed method vs baseline.
model_base: liuhaotian/llava-v1.5-7b
common_args: { attn_implementation: eager }   # proposed needs eager; baseline ok with it
# mmbench_en_dev / mmmu_val omitted: their metrics need an OpenAI API key (GPT eval).
tasks: [pope, gqa, textvqa_val, mme, scienceqa_img, vizwiz_vqa_val, ocrbench]
batch_size: 1                                  # clean per-sample timing; proposed assumes bs=1
runs:
  - { name: baseline,              model: llava_baseline, model_args: {} }
  # Stage-1-only ablation (vision-tower prune, 576 -> R1=64; normal KV cache).
  - { name: proposed_stage1_R1-64, model: llava_proposed,
      model_args: { dominant_k: 54, diversity_m: 10, stage2_enabled: false } }
  # Full Stage 1+2 (no-slice decode: GPU-validated, decode stays seq==1).
  - { name: proposed_R1-64_R2-37_k12, model: llava_proposed,
      model_args: { dominant_k: 54, diversity_m: 10, pruned_layer: 12, llm_keep_r2: 37 } }
  # Final settings: R1:R2 = 3:1, prune@layer 12, at average-token budgets
  # 32 / 64 / 128 (5.7/11/22%). Diversity = 50% of R1 (ablation winner — accuracy
  # rises with diversity, plateaus ~40-50%; see div10..div50 ablation runs below).
  - { name: proposed_avg32_3to1,  model: llava_proposed,
      model_args: { dominant_k: 27,  diversity_m: 27,  pruned_layer: 12, llm_keep_r2: 18 } }
  - { name: proposed_avg64_3to1,  model: llava_proposed,
      model_args: { dominant_k: 52,  diversity_m: 53,  pruned_layer: 12, llm_keep_r2: 35 } }
  - { name: proposed_avg128_3to1, model: llava_proposed,
      model_args: { dominant_k: 106, diversity_m: 107, pruned_layer: 12, llm_keep_r2: 71 } }
  # Exp 1 — diversity-ratio ablation at avg-64 (R1=105, R2=35, R1:R2=3:1);
  # vary only the dominant/diversity split of R1.
  # NOTE: div10 is identical to proposed_avg64_3to1 above (dominant 95 / div 10 /
  # R2 35) — keep both for a clean div10/20/30 ablation triplet; on the box, copy
  # proposed_avg64_3to1's result dir to proposed_div10_avg64 to skip recompute.
  - { name: proposed_div10_avg64, model: llava_proposed,
      model_args: { dominant_k: 95, diversity_m: 10, pruned_layer: 12, llm_keep_r2: 35 } }
  - { name: proposed_div20_avg64, model: llava_proposed,
      model_args: { dominant_k: 84, diversity_m: 21, pruned_layer: 12, llm_keep_r2: 35 } }
  - { name: proposed_div30_avg64, model: llava_proposed,
      model_args: { dominant_k: 74, diversity_m: 31, pruned_layer: 12, llm_keep_r2: 35 } }
  # Extended ablation: diversity hasn't plateaued at 30% — probe 40% / 50%.
  - { name: proposed_div40_avg64, model: llava_proposed,
      model_args: { dominant_k: 63, diversity_m: 42, pruned_layer: 12, llm_keep_r2: 35 } }
  - { name: proposed_div50_avg64, model: llava_proposed,
      model_args: { dominant_k: 52, diversity_m: 53, pruned_layer: 12, llm_keep_r2: 35 } }
