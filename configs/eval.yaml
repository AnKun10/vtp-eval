# configs/eval.yaml — benchmark runs for the proposed method vs baseline.
model_base: liuhaotian/llava-v1.5-7b
common_args: { attn_implementation: eager }   # proposed needs eager; baseline ok with it
# mmbench_en_dev / mmmu_val omitted: their metrics need an OpenAI API key (GPT eval).
tasks: [pope, gqa, textvqa_val, mme, scienceqa_img, vizwiz_vqa_val, ocrbench]
batch_size: 1                                  # clean per-sample timing; proposed assumes bs=1
runs:
  - { name: baseline,              model: llava_baseline, model_args: {} }
  # Stage-1-only ablation (vision-tower prune, 576 -> R1=64; normal KV cache).
  - { name: proposed_stage1_R1-64, model: llava_proposed,
      model_args: { dominant_k: 54, diversity_m: 10, stage2_enabled: false } }
  # Full Stage 1+2 (no-slice decode: GPU-validated, decode stays seq==1).
  - { name: proposed_R1-64_R2-37_k12, model: llava_proposed,
      model_args: { dominant_k: 54, diversity_m: 10, pruned_layer: 12, llm_keep_r2: 37 } }
