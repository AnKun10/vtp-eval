# prune_viz sample sources (field coverage across benchmark domains).
# `n` per dataset overrides samples_per_dataset; `config` = HF dataset config name.
# gqa is omitted: lmms-lab/GQA splits image and question into separate configs
# (no single config has both), so it doesn't fit the simple streaming fetch.
samples_per_dataset: 5
datasets:
  pope:      { hf: lmms-lab/POPE,         split: test,       image_key: image, q_key: question }
  textvqa:   { hf: lmms-lab/textvqa,      split: validation, image_key: image, q_key: question }
  mme:       { hf: lmms-lab/MME,          split: test,       image_key: image, q_key: question }
  scienceqa: { hf: lmms-lab/ScienceQA,    config: ScienceQA-IMG, split: test, image_key: image, q_key: question }
  vizwiz:    { hf: lmms-lab/VizWiz-VQA,   split: val,        image_key: image, q_key: question }
  ocrbench:  { hf: echo840/OCRBench,      split: test,       image_key: image, q_key: question }
